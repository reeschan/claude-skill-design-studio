<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>design-studio</title>
    <script>
      // 明るさ (ダーク / ライト) を描画の前に決める。選んだものがあればそれ、無ければ OS の設定 (既定はダーク)
      try {
        const saved = localStorage.getItem("design-studio:mode");
        if (saved === "dark" || saved === "light") document.documentElement.dataset.mode = saved;
      } catch {
        // 保存先が使えないときは OS の設定に従う
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      /* 見た目は作業台で作ったプロジェクト「ネオンターミナル」(漆黒の地にシアンが走る、鋭く精緻なコンソール) の
         トークンと、面 Glass (data/surfaces.json の glass)。背景にシアンと紫の光を敷き、ヘッダー・カード・
         パネルを半透明にしてぼかす。ダークを基本にし、ライトは data-mode="light" か、選んでいないときの OS の設定で使う */
      :root {
        color-scheme: dark;
        --background: oklch(0.16 0.02 249.9);
        --foreground: oklch(0.96 0.02 249.9);
        --card: oklch(0.2 0.02 249.9);
        --surface: oklch(0.25 0.02 249.9);
        --muted-foreground: oklch(0.68 0.02 249.9);
        --border: oklch(0.3 0.02 249.9);
        --primary: oklch(0.7 0.12 205);
        --primary-foreground: oklch(0.18 0.02 249.9);
        --marker: oklch(0.72 0.128 300);
        --ring: oklch(0.62 0.106 205);
        --accent-soft: oklch(0.28 0.049 205);
        --accent-soft-fg: oklch(0.85 0.127 205);
        --warning: oklch(0.75 0.136 75);
        --destructive: oklch(0.62 0.2 25);
        /* 面 Glass: 背景の光の濃さ、半透明の面の濃さ、縁の光 */
        --glow-a: color-mix(in oklab, var(--primary) 30%, transparent);
        --glow-b: color-mix(in oklab, var(--marker) 26%, transparent);
        --glow-c: color-mix(in oklab, var(--accent-soft) 70%, transparent);
        --glass: 66%;
        --glass-highlight: inset 0 1px 0 color-mix(in oklab, var(--foreground) 20%, transparent);
        --header-bg: color-mix(in oklab, var(--card) 62%, transparent);
        --shadow: var(--glass-highlight), 0 12px 32px -20px color-mix(in oklab, var(--primary) 55%, transparent);
        --shadow-pop: 0 0 0 1px var(--marker), 0 0 18px -4px var(--marker);
        --gradient: linear-gradient(120deg, var(--primary), var(--marker));
        --radius: 5px;
        --radius-sm: 3px;
        --font-heading: "Zen Kaku Gothic New", system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
        --font-body: "Noto Sans JP", system-ui, "Hiragino Sans", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;

        /* 画面の JS (作業台など) が使う名前。上のトークンに結び付ける。パネルは Glass の半透明の面 */
        --bg: var(--background);
        --panel: color-mix(in oklab, var(--card) var(--glass), transparent);
        --fg: var(--foreground);
        --muted: var(--muted-foreground);
        --line: var(--border);
        --accent: var(--primary);
        --accent-fg: var(--primary-foreground);
        --notice-bg: color-mix(in oklch, var(--warning) 14%, var(--card));
        --notice-fg: var(--warning);
        --notice-line: color-mix(in oklch, var(--warning) 45%, transparent);
        --error-fg: var(--destructive);
      }

      :root[data-mode="light"] {
        color-scheme: light;
        --background: oklch(0.985 0.007 249.9);
        --foreground: oklch(0.2 0.02 249.9);
        --card: oklch(1 0 249.9);
        --surface: oklch(0.955 0.02 249.9);
        --muted-foreground: oklch(0.48 0.02 249.9);
        --border: oklch(0.9 0.02 249.9);
        --primary: oklch(0.55 0.094 205);
        --primary-foreground: oklch(0.995 0.003 249.9);
        --marker: oklch(0.6 0.136 300);
        --accent-soft: oklch(0.95 0.051 205);
        --accent-soft-fg: oklch(0.35 0.061 205);
        --warning: oklch(0.55 0.13 75);
        --destructive: oklch(0.55 0.198 25);
        --glow-a: color-mix(in oklab, var(--primary) 18%, transparent);
        --glow-b: color-mix(in oklab, var(--marker) 16%, transparent);
        --glass: 72%;
        --glass-highlight: inset 0 1px 0 color-mix(in oklab, var(--card) 80%, transparent);
        --shadow: var(--glass-highlight), 0 12px 30px -22px color-mix(in oklab, var(--foreground) 40%, transparent);
        --notice-bg: color-mix(in oklch, var(--warning) 12%, var(--card));
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-mode]) {
          color-scheme: light;
          --background: oklch(0.985 0.007 249.9);
          --foreground: oklch(0.2 0.02 249.9);
          --card: oklch(1 0 249.9);
          --surface: oklch(0.955 0.02 249.9);
          --muted-foreground: oklch(0.48 0.02 249.9);
          --border: oklch(0.9 0.02 249.9);
          --primary: oklch(0.55 0.094 205);
          --primary-foreground: oklch(0.995 0.003 249.9);
          --marker: oklch(0.6 0.136 300);
          --accent-soft: oklch(0.95 0.051 205);
          --accent-soft-fg: oklch(0.35 0.061 205);
          --warning: oklch(0.55 0.13 75);
          --destructive: oklch(0.55 0.198 25);
          --glow-a: color-mix(in oklab, var(--primary) 18%, transparent);
          --glow-b: color-mix(in oklab, var(--marker) 16%, transparent);
          --glass: 72%;
          --glass-highlight: inset 0 1px 0 color-mix(in oklab, var(--card) 80%, transparent);
          --shadow: var(--glass-highlight), 0 12px 30px -22px color-mix(in oklab, var(--foreground) 40%, transparent);
          --notice-bg: color-mix(in oklch, var(--warning) 12%, var(--card));
        }
      }

      /* 面 Glass: ヘッダー・カード・パネルの背景をぼかす。ぼかせないブラウザでは不透明に近い面にする */
      .app-header,
      .tabs,
      .card,
      .overlay-panel,
      .install,
      .wb-section {
        backdrop-filter: blur(12px) saturate(140%);
      }

      @supports not (backdrop-filter: blur(1px)) {
        :root {
          --glass: 94%;
          --header-bg: color-mix(in oklab, var(--card) 94%, var(--background));
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        /* 面 Glass: 背景にシアン・紫・淡いシアンの光を敷き、半透明の面の向こうに透かして見せる */
        background:
          radial-gradient(70rem 42rem at 8% -12%, var(--glow-a), transparent 70%),
          radial-gradient(54rem 38rem at 92% 8%, var(--glow-b), transparent 72%),
          radial-gradient(46rem 34rem at 50% 108%, var(--glow-c), transparent 75%), var(--background);
        background-attachment: fixed;
        color: var(--fg);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.7;
      }

      h1,
      h2,
      h3,
      h4,
      h5 {
        font-family: var(--font-heading);
        line-height: 1.35;
        letter-spacing: -0.005em;
        overflow-wrap: anywhere;
      }

      ::selection {
        background: var(--accent-soft);
        color: var(--accent-soft-fg);
      }

      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      input,
      select,
      textarea {
        accent-color: var(--primary);
      }

      p,
      li {
        overflow-wrap: anywhere;
      }

      /* 殻: 上部のアプリ名とタブ、注意の帯 */

      .app-header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--header-bg);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(14px) saturate(1.2);
      }

      .app-header-inner {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        align-items: center;
        justify-content: space-between;
        max-width: 1240px;
        margin: 0 auto;
        padding: 12px 16px;
      }

      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .brand-mark {
        flex: none;
        width: 34px;
        height: 34px;
        border: 1.5px solid var(--primary);
        border-radius: var(--radius-sm);
        /* 照準の印: 中心の十字と紫の点。縁をシアンで光らせる */
        background:
          radial-gradient(circle at 50% 50%, var(--marker) 0 3px, transparent 3.5px),
          linear-gradient(var(--primary), var(--primary)) 50% 50% / 1px 100% no-repeat,
          linear-gradient(var(--primary), var(--primary)) 50% 50% / 100% 1px no-repeat,
          var(--card);
        box-shadow: 0 0 14px -4px var(--primary);
      }

      .app-name {
        margin: 0;
        font-family: var(--font-heading);
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.3;
        color: var(--fg);
      }

      .app-name::after {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-left: 3px;
        background: var(--marker);
      }

      .app-lead {
        margin: 1px 0 0;
        font-size: 12.5px;
        color: var(--muted);
      }

      .header-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--panel);
      }

      .tab {
        font: inherit;
        font-size: 14px;
        padding: 5px 16px;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition:
          color 0.15s,
          background-color 0.15s;
      }

      .tab:hover {
        color: var(--fg);
        background: var(--surface);
      }

      .tab[aria-current="page"] {
        background: var(--gradient);
        color: var(--primary-foreground);
        font-weight: 700;
      }

      .mode-toggle {
        font: inherit;
        font-family: var(--font-mono);
        font-size: 11.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--panel);
        color: var(--muted);
        cursor: pointer;
      }

      .mode-toggle:hover {
        color: var(--fg);
        border-color: var(--primary);
      }

      .notice {
        max-width: 1240px;
        margin: 0 auto;
        padding: 10px 16px 0;
      }

      .notice p {
        margin: 0 0 6px;
        padding: 9px 12px;
        border: 1px solid var(--notice-line);
        border-radius: var(--radius-sm);
        background: var(--notice-bg);
        color: var(--notice-fg);
        font-size: 13.5px;
      }

      .app-main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 22px 16px 40px;
      }

      .screen[hidden] {
        display: none;
      }

      .screen-title {
        margin: 0 0 4px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.015em;
      }

      .screen-lead {
        margin: 0 0 14px;
        color: var(--muted);
      }

      .status {
        min-height: 1.6em;
        margin: 8px 0;
        font-size: 13.5px;
        color: var(--muted);
      }

      .status-error {
        color: var(--error-fg);
      }

      .field {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }

      .btn {
        font: inherit;
        font-size: 13px;
        padding: 5px 13px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--fg);
        cursor: pointer;
        transition:
          border-color 0.15s,
          filter 0.15s;
      }

      .btn:hover:not([disabled]) {
        border-color: var(--primary);
      }

      .btn[disabled] {
        opacity: 0.5;
        cursor: default;
      }

      .btn-primary {
        border-color: transparent;
        background: var(--gradient);
        color: var(--primary-foreground);
        font-weight: 700;
      }

      .btn-primary:hover:not([disabled]) {
        border-color: transparent;
        filter: brightness(1.08);
      }

      /* 台帳 */

      .stage {
        margin: 0 0 26px;
      }

      .stage-title {
        margin: 0 0 2px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
        font-size: 19px;
        font-weight: 700;
      }

      .stage-title::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 10px;
        border-radius: 1px;
        background: var(--marker);
        vertical-align: 0.08em;
      }

      .stage-note {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13.5px;
      }

      .role {
        margin: 16px 0 0;
      }

      .role-title {
        margin: 0 0 10px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent-soft-fg);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 12px;
      }

      .card {
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow);
        transition:
          border-color 0.15s,
          transform 0.15s;
      }

      .card:hover {
        border-color: color-mix(in oklch, var(--primary) 55%, var(--line));
      }

      .card-head {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        justify-content: space-between;
      }

      .card-name {
        margin: 0;
        font-family: var(--font-heading);
        font-size: 16px;
        font-weight: 700;
      }

      .card-summary {
        margin: 8px 0;
      }

      .card-meta {
        margin: 8px 0;
        font-size: 12.5px;
        color: var(--muted);
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0;
      }

      .badge {
        padding: 1px 9px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.02em;
        line-height: 1.6;
      }

      .badge-alert {
        border-color: transparent;
        background: var(--accent-soft);
        color: var(--accent-soft-fg);
        font-weight: 700;
      }

      .switch {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        cursor: pointer;
      }

      .details {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px dashed var(--line);
      }

      .details summary {
        font-size: 13.5px;
        color: var(--muted);
        cursor: pointer;
      }

      .details h4 {
        margin: 12px 0 4px;
        font-size: 13px;
      }

      pre {
        margin: 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        font-family: var(--font-mono);
        font-size: 12.5px;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .notes {
        margin: 0;
        padding-left: 20px;
        font-size: 13px;
      }

      .prereq {
        margin: 10px 0 0;
      }

      .prereq-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin: 4px 0 0;
      }

      .prereq-row code,
      .install-list code {
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        font-family: var(--font-mono);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .install {
        margin: 30px 0 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
      }

      .install-list {
        margin: 6px 0 0;
        padding-left: 20px;
        font-size: 13.5px;
      }

      /* 見本帳 */

      .gallery-scroll {
        overflow-x: auto;
        padding-bottom: 8px;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: minmax(170px, 210px) repeat(var(--gallery-cols, 3), 320px);
        gap: 12px;
        align-items: start;
      }

      .gallery-col {
        padding: 0 2px 6px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent-soft-fg);
      }

      .gallery-style {
        position: sticky;
        left: 0;
        z-index: 1;
        padding: 10px 12px;
        /* 横に流した見本の上に重なるので、Glass の面でぼかして読めるようにする */
        background: var(--panel);
        backdrop-filter: blur(12px) saturate(140%);
        border-radius: var(--radius-sm);
      }

      .gallery-style h3 {
        margin: 0;
        font-size: 15px;
      }

      .gallery-style p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      .thumb {
        position: relative;
        width: 320px;
        height: 200px;
        overflow: hidden;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: #fff;
        cursor: zoom-in;
        box-shadow: var(--shadow);
        transition:
          transform 0.15s,
          border-color 0.15s;
      }

      .thumb:hover {
        border-color: var(--primary);
        transform: translateY(-2px);
      }

      .thumb:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      .thumb iframe {
        width: 1280px;
        height: 800px;
        border: 0;
        transform: scale(0.25);
        transform-origin: top left;
        pointer-events: none;
      }

      .thumb-empty {
        display: grid;
        place-items: center;
        cursor: default;
        background: var(--panel);
      }

      .thumb-empty span {
        color: var(--muted);
        font-size: 13.5px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        background: oklch(0.1 0.02 295 / 70%);
        backdrop-filter: blur(6px);
      }

      .overlay-panel {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 1240px;
        height: 100%;
        max-height: 960px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .overlay-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }

      .overlay-title {
        margin: 0;
        font-size: 16px;
      }

      .overlay-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        font-size: 13px;
      }

      .overlay-controls select {
        font: inherit;
        font-size: 13px;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--fg);
      }

      .seg {
        display: inline-flex;
        gap: 4px;
      }

      .seg button {
        font: inherit;
        font-size: 13px;
        padding: 3px 11px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
      }

      .seg button:hover {
        color: var(--fg);
      }

      .seg button[aria-pressed="true"] {
        border-color: transparent;
        background: var(--accent-soft);
        color: var(--accent-soft-fg);
        font-weight: 700;
      }

      .overlay-status {
        margin: 0;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }

      .overlay-body {
        flex: 1;
        min-height: 0;
        background: #fff;
      }

      .overlay-body iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* 作業台: 左に依頼と案、中央にプレビュー、右に調整の区画を並べる 3 列。
         幅 1280px 以上で 3 列にし、それより狭いときは右の列を中央の下に回す */

      .wb-grid {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr) 380px;
        gap: 12px;
        align-items: start;
      }

      .wb-col {
        min-width: 0;
      }

      /* 3 列のときは、右の列で設定をスクロールしてもプレビューが見えるよう、中央の列をヘッダーの下に付いてこさせる */
      @media (min-width: 1280px) {
        #wb-stage {
          position: sticky;
          top: 84px;
          max-height: calc(100vh - 96px);
          overflow-y: auto;
          overscroll-behavior: contain;
        }
      }

      @media (max-width: 1279px) {
        .wb-grid {
          grid-template-columns: 340px minmax(0, 1fr);
          /* 左の列の余った高さを 2 行目に回し、右の列をプレビューのすぐ下に寄せる */
          grid-template-rows: auto 1fr;
        }

        /* 左の列を 2 行にまたがらせ、右の列をプレビューのすぐ下 (間は gap だけ) に出す */
        #wb-brief {
          grid-row: 1 / span 2;
        }

        #wb-panels {
          grid-column: 2;
        }
      }

      /* さらに狭い幅 (スマホ・細い窓) では 1 列に積む: 依頼と案 → プレビュー → 調整 */
      @media (max-width: 760px) {
        .wb-grid {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: none;
        }

        #wb-brief {
          grid-row: auto;
        }

        #wb-panels {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="app-name">design-studio</p>
            <p class="app-lead">曖昧な一言から、ページの見た目を具体化する</p>
          </div>
        </div>
        <div class="header-tools">
          <nav class="tabs" aria-label="画面">
            <button type="button" class="tab" data-tab="catalog" aria-current="page">台帳</button>
            <button type="button" class="tab" data-tab="gallery">見本帳</button>
            <button type="button" class="tab" data-tab="workbench">作業台</button>
          </nav>
          <button type="button" class="mode-toggle" id="mode-toggle" aria-label="明るさを切り替える">Light</button>
        </div>
      </div>
      <div class="notice" id="meta-notice" hidden></div>
    </header>
    <main class="app-main">
      <section id="catalog" class="screen" aria-label="台帳"></section>
      <section id="gallery" class="screen" aria-label="見本帳" hidden></section>
      <section id="workbench" class="screen" aria-label="作業台" hidden>
        <h2 class="screen-title">作業台</h2>
        <p class="screen-lead">依頼から案を出し、見比べて編集し、混ぜた見た目をプレビューで確かめます。</p>
        <p class="status" id="wb-status"></p>
        <p class="wb-waiting">作業台を組み立てています…</p>
        <div class="wb-grid">
          <div class="wb-col" id="wb-brief"></div>
          <div class="wb-col" id="wb-stage"></div>
          <div class="wb-col" id="wb-panels"></div>
        </div>
      </section>
    </main>
    <script type="module" src="/app/ui-catalog.js"></script>
    <script type="module" src="/app/ui-gallery.js"></script>
    <script type="module" src="/app/ui-workbench.js"></script>
    <script type="module">
      // 殻の処理: タブの切り替えと、起動時の注意の帯 (style-guide と claude CLI の有無) の表示
      const tabs = Array.from(document.querySelectorAll("button[data-tab]"));
      const screens = Array.from(document.querySelectorAll("main .screen"));

      function showTab(tab) {
        for (const button of tabs) {
          if (button.dataset.tab === tab) button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
        }
        for (const screen of screens) {
          screen.hidden = screen.id !== tab;
        }
      }

      for (const button of tabs) {
        button.addEventListener("click", () => showTab(button.dataset.tab ?? "catalog"));
      }

      async function checkMeta() {
        const notice = document.getElementById("meta-notice");
        if (notice === null) return;
        let meta = null;
        try {
          const res = await fetch("/api/meta");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          meta = await res.json();
        } catch {
          const failed = document.createElement("p");
          failed.textContent = "起動時の確認に失敗しました。アプリのサーバーが動いているか確かめてください。";
          notice.append(failed);
          notice.hidden = false;
          return;
        }
        const info = typeof meta === "object" && meta !== null ? meta : {};
        const messages = [];
        if (info.styleGuide !== "ok") {
          messages.push("style-guide が入っていません。テーマを作るには、Claude Code で /design-studio install を実行してください。");
        }
        if (info.llmAvailable !== true) {
          messages.push("claude CLI が見つかりません。方向性の案とページの作成には claude CLI が必要です (Claude Code と一緒に入ります)。");
        }
        for (const message of messages) {
          const line = document.createElement("p");
          line.textContent = message;
          notice.append(line);
        }
        if (messages.length > 0) notice.hidden = false;
      }

      void checkMeta();

      // 明るさの切り替え。押すとダークとライトを入れ替え、選んだものを覚える (保存先が使えなければ覚えない)
      const modeToggle = document.getElementById("mode-toggle");
      const lightQuery = window.matchMedia("(prefers-color-scheme: light)");

      function currentMode() {
        const chosen = document.documentElement.dataset.mode;
        if (chosen === "dark" || chosen === "light") return chosen;
        return lightQuery.matches ? "light" : "dark";
      }

      function syncModeToggle() {
        if (modeToggle === null) return;
        const next = currentMode() === "dark" ? "light" : "dark";
        modeToggle.textContent = next === "light" ? "Light" : "Dark";
        modeToggle.setAttribute("aria-label", next === "light" ? "ライトにする" : "ダークにする");
      }

      modeToggle?.addEventListener("click", () => {
        const next = currentMode() === "dark" ? "light" : "dark";
        document.documentElement.dataset.mode = next;
        try {
          localStorage.setItem("design-studio:mode", next);
        } catch {
          // 覚えられなくても、この表示の間は切り替わる
        }
        syncModeToggle();
      });
      lightQuery.addEventListener("change", syncModeToggle);
      syncModeToggle();
    </script>
  </body>
</html>
